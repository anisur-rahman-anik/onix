<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Good Afternoon</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      padding: 50px 60px;
      border-radius: 20px;
      backdrop-filter: blur(15px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
      text-align: center;
      animation: fadeIn 1.5s ease;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      color: #fff;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #f1f1f1;
      font-size: 20px;
      margin-bottom: 25px;
    }

    .name {
      font-size: 32px;
      font-weight: 600;
      color: #ffd700;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 50px;
      background: linear-gradient(45deg, #ff6a00, #ee0979);
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* floating circles */
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      animation: float 10s infinite ease-in-out;
    }

    .circle:nth-child(1) {
      width: 200px;
      height: 200px;
      top: 10%;
      left: 10%;
    }

    .circle:nth-child(2) {
      width: 150px;
      height: 150px;
      bottom: 15%;
      right: 10%;
      animation-delay: 2s;
    }

    .circle:nth-child(3) {
      width: 100px;
      height: 100px;
      bottom: 40%;
      left: 20%;
      animation-delay: 4s;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>
<body>

  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>

  <div class="card">
    <div class="title">Good Afternoon 🎉</div>
    <div class="subtitle">Wishing you a cozy afternoon with joy</div>
    <div class="name">Anik</div>
    <a href="#" class="btn">Best Wishes for you</a>
  </div>

</body>
</html>
